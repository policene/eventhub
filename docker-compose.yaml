services:
  mysql:
    container_name: mysql
    restart: always
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASS}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASS}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - ${DATABASE_PORT}:3306

volumes:
  db_data: